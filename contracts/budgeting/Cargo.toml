[package]
name = "polestar-budgeting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Polestar participatory-budgeting contract for NEAR Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
allocate = { workspace = true, features = ["schemars"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest = { workspace = true }
near-workspaces = { version = "0.24", features = ["experimental"] }
near-primitives = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
futures = "0.3"
serde_json = { workspace = true, features = ["arbitrary_precision"] }
