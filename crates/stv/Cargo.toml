[package]
name = "polestar-stv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Single Transferable Vote (Scottish STV with Gregory surplus transfers) counting engine"

[dependencies]
polestar-rational = { workspace = true }
borsh = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["borsh", "serde"]
borsh = ["dep:borsh", "polestar-rational/borsh"]
serde = ["dep:serde", "polestar-rational/serde"]
schemars = ["dep:schemars", "polestar-rational/schemars"]
