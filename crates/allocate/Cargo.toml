[package]
name = "allocate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Participatory-budgeting allocation engine: Method of Equal Shares plus a density-ranked completion stage"

[dependencies]
math = { workspace = true }
borsh = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = ["borsh", "serde"]
borsh = ["dep:borsh", "math/borsh"]
serde = ["dep:serde", "math/serde"]
schemars = ["dep:schemars", "math/schemars"]
