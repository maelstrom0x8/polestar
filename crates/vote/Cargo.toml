[package]
name = "vote"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Single Transferable Vote (Scottish STV with Gregory surplus transfers) counting engine"

[dependencies]
math = { workspace = true }
borsh = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["borsh", "serde"]
borsh = ["dep:borsh", "math/borsh"]
serde = ["dep:serde", "math/serde"]
schemars = ["dep:schemars", "math/schemars"]
