[workspace]
members = [
    "crates/math",
    "crates/allocate",
    "contracts/budgeting",
    "pscli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Polestar Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
proptest = "1.6"
clap = { version = "4.5", features = ["derive", "env"] }

math = { path = "crates/math" }
allocate = { path = "crates/allocate" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
